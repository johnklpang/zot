apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
  namespace: zot-registry
  labels:
    app.kubernetes.io/name: zot
    app.kubernetes.io/component: registry
spec:
  replicas: 1
  # Recreate avoids two pods mounting the same RWO volume during upgrades
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zot
      app.kubernetes.io/component: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zot
        app.kubernetes.io/component: registry
    spec:
      # Schedule onto the worker that holds the hostPath volume
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: zot-registry/storage
                    operator: In
                    values:
                      - "true"
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: zot
          image: ghcr.io/project-zot/zot-linux-amd64:v2.1.8
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - /etc/zot/config.json
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          volumeMounts:
            - name: zot-data
              mountPath: /var/lib/registry
            - name: zot-config
              mountPath: /etc/zot
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /v2/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v2/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: zot-data
          persistentVolumeClaim:
            claimName: zot-registry-pvc
        - name: zot-config
          configMap:
            name: zot-config
        - name: tmp
          emptyDir: {}
