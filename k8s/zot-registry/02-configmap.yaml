apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
  namespace: zot-registry
  labels:
    app.kubernetes.io/name: zot
    app.kubernetes.io/component: registry
data:
  config.json: |
    {
      "distSpecVersion": "1.1.0",
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "dedupe": true,
        "gc": true,
        "gcDelay": "1h",
        "gcInterval": "24h"
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "realm": "zot"
      },
      "log": {
        "level": "info"
      }
    }
